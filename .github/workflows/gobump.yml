name: GoBump

on:
  schedule:
    - cron: '0 8 * * 1' # Every Monday at 08:00 UTC
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled]
    branches:
      - '**'
    paths-ignore:
      - 'docs/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  gobump:
    name: Bump Go dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ./tools/toolbox/go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run gobump
        run: make gobump

      - name: Create or update pull request when dependencies change
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: "chore: bump Go dependencies"
          BRANCH: gobump-update
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          if git diff --quiet; then
            echo "No tracked changes to commit."
            exit 0
          fi

          git checkout -b "${BRANCH}"
          git add -u
          scripts/create-signed-commit.sh
          TITLE="chore: bump Go dependencies"
          BODY=$'This automated pull request updates Go dependencies using `make gobump`.\n\nPlease review the dependency changes and CI results before merging.'
          scripts/create-pull-request.sh "$BASE_BRANCH" "$BRANCH" "$TITLE" "$BODY"
