name: GoBump

on:
  schedule:
    - cron: '0 8 * * 1' # Every Monday at 08:00 UTC
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled]
    branches:
      - '**'
    paths-ignore:
      - 'docs/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  gobump:
    name: Bump Go dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ./tools/toolbox/go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run gobump
        run: make gobump

      - name: Check for tracked changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "No tracked changes to commit."
            echo "CHANGES=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tracked changes detected."
            echo "CHANGES=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes and create or update pull request
        if: steps.check_changes.outputs.CHANGES == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: "chore: bump Go dependencies"
          BRANCH: gobump-update
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          git checkout -b "${BRANCH}"
          git add -u
          scripts/create-signed-commit.sh
          TITLE="chore: bump Go dependencies"
          BODY=$'This automated pull request updates Go dependencies using `make gobump`.\n\nPlease review the dependency changes and CI results before merging.'
          PR_NUMBER=$(gh pr list --head "$BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$PR_NUMBER" ]]; then
            gh pr edit "$PR_NUMBER" --title "$TITLE" --body "$BODY"
          else
            gh pr create --base "$BASE_BRANCH" --head "$BRANCH" --title "$TITLE" --body "$BODY"
          fi
